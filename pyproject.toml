[project]
name = "radar-rudy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2", "alembic>=1.13", "pydantic-settings>=2.5",
  "jinja2>=3.1", "itsdangerous>=2.2", "httpx>=0.27", "cryptography>=43.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
